<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://davirian-dev.github.io/familia-em-foco/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Família em Foco - Redirecionando...</title>
  <style>
    body {
      background-color: #090D16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #818cf8;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Redirecionando para o Família em Foco...</h2>
  <p>Caso não seja redirecionado em instantes, <a href="https://davirian-dev.github.io/familia-em-foco/">clique aqui</a>.</p>
  <script>
    window.location.replace("https://davirian-dev.github.io/familia-em-foco/");
  </script>
</body>
</html>
